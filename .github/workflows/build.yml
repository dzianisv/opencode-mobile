name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Node >= 23.6 runs the TypeScript test files natively (type-stripping),
          # matching the local toolchain. No build step or extra deps required.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Check release version metadata
        run: npm run check:versions

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
      EXPO_PUBLIC_POSTHOG_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_KEY }}
      EXPO_PUBLIC_CHATWOOT_INBOX_IDENTIFIER: ${{ secrets.EXPO_PUBLIC_CHATWOOT_INBOX_IDENTIFIER }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Derive CI versionCode/versionName
        # Issue #266: this job used to build at the repo versionCode (51) —
        # the same code the Play AAB's source tree carries — while shipping a
        # DIFFERENT JS bundle (different debug id) than the Play AAB. Same
        # versionCode, different builds: the CI APK went out on the GitHub
        # release (184 downloads at v0.4.22) indistinguishable from the Play
        # build, and a fix verified against one build was not proven against
        # the other. Give every CI build its own Android identity:
        #   versionCode = 1_000_000 + github.run_number
        #   versionName = <expo.version>-ci.<github.run_number>
        #     (via expo.android.version — config-plugins reads
        #     config.android.version, NOT android.versionName, for the
        #     Gradle versionName; verified by a local prebuild run)
        # The ranges are disjoint by construction, so this can never collide
        # with Play's run_number+100 scheme (publish-play-store.yml, 162 for
        # 0.4.22) or with the repo versionCode 51: Play reaches 1,000,000 only
        # after ~999,900 publishes, and CI stays below Android's
        # 2,100,000,000 cap for ~2.1B runs. github.run_number is monotonic
        # per workflow, so each CI APK is also an upgrade over the previous
        # one for sideload users. In-workflow only (app.json is NOT committed
        # with these values), so `npm run check:versions` in the test job —
        # which pins the committed 51 to distribution/changelogs/51.txt —
        # keeps passing unchanged.
        # The build-fdroid job in this workflow is deliberately NOT touched:
        # its APK is F-Droid's Binaries: reference (metadata.yml) and must
        # carry the repo versionCode 51 so F-Droid's from-source rebuild
        # compares against the same code; publish-fdroid.yml stays at 51 for
        # the same reason (its repo users upgrade off versionCode).
        # SENTRY_DIST follows this step (issue #269): the identifiers step
        # below reads the versionCode derived here into dist
        # <version>+<versionCode>, the same value the runtime reports
        # (src/lib/sentry.ts via src/lib/sentry-dist.ts), and the lockstep
        # assertion step verifies they agree. An upload-side-only change
        # would repeat the #265 release/dist mismatch, so the dist is
        # never set here — only derived from the mutated app.json.
        run: |
          node -e "const f='app.json';const j=require('./'+f);const v=j.expo.version;j.expo.android=j.expo.android||{};j.expo.android.versionCode=1000000+${{ github.run_number }};j.expo.android.version=v+'-ci.'+${{ github.run_number }};require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          echo "CI versionCode: $(node -p "require('./app.json').expo.android.versionCode")"
          echo "CI versionName: $(node -p "require('./app.json').expo.android.version")"

      - name: Set Sentry release identifiers
        # sentry.gradle (applied from android/app/build.gradle) defaults the
        # upload's --release/--dist to `${applicationId}@${versionName}+${versionCode}`,
        # which does NOT match the release/dist Sentry.init() reports at runtime
        # (`opencode-mobile@${app.json version}`, see src/lib/sentry.ts). That
        # mismatch made every uploaded source map land under a release Sentry
        # never looks up, so symbolication silently failed. Pin the Gradle-side
        # values to exactly what the app reports.
        # Dist (issue #269) is <expo.version>+<expo.android.versionCode>, the
        # same formula the runtime builds in src/lib/sentry-dist.ts from the
        # same app.json — so one release+dist identifies exactly one build.
        # This step runs AFTER "Derive CI versionCode/versionName" and reads
        # the mutated app.json; a missing code hard-fails here, never silently
        # uploads under a version-only dist.
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./app.json').expo.version")
          CODE=$(node -p "require('./app.json').expo.android.versionCode")
          if [ -z "$CODE" ] || [ "$CODE" = "undefined" ]; then
            echo "::error::expo.android.versionCode is missing from app.json — cannot derive SENTRY_DIST"
            exit 1
          fi
          echo "SENTRY_RELEASE=opencode-mobile@${VERSION}" >> "$GITHUB_ENV"
          echo "SENTRY_DIST=${VERSION}+${CODE}" >> "$GITHUB_ENV"
          echo "Sentry release=opencode-mobile@${VERSION} dist=${VERSION}+${CODE}"

      - name: Assert Sentry dist matches app.json (lockstep)
        # Issue #269: the runtime dist and the upload dist are computed in two
        # places from two inputs, so they drifted silently (see #265). Re-read
        # app.json and fail if SENTRY_DIST is not ${version}+${versionCode} —
        # the same value src/lib/sentry.ts reports at runtime.
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./app.json').expo.version")
          CODE=$(node -p "require('./app.json').expo.android.versionCode")
          EXPECTED="${VERSION}+${CODE}"
          if [ "${SENTRY_DIST:-}" != "$EXPECTED" ]; then
            echo "::error::SENTRY_DIST (${SENTRY_DIST:-<unset>}) != app.json version+versionCode ($EXPECTED) — runtime/upload dist mismatch"
            exit 1
          fi
          echo "Lockstep OK: SENTRY_DIST=$SENTRY_DIST matches app.json $EXPECTED"

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Setup signing
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* && -n "${{ secrets.KEYSTORE_BASE64 }}" ]]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
            echo "RELEASE_STORE_FILE=release.keystore" >> "$GITHUB_ENV"
            echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Signing: production keystore"
          else
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Signing: debug keystore (non-release build)"
          fi

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk

  # F-Droid rebuilds this app from source using the recipe in
  # distribution/fdroid-submission/metadata.yml (Builds:), which applies
  # fdroid/expo-application-patches, fdroid/expo-notifications-patches and
  # fdroid/expo-store-review-patches to
  # strip Firebase Cloud Messaging / Play Install Referrer / Play In-App Review
  # / Sentry before compiling. If we only ever publish the full-featured `app-release.apk`
  # (built above, unpatched) and metadata.yml's `Binaries:` points at it,
  # F-Droid's reproducible-build check compares its from-source (patched)
  # rebuild against that (unpatched) reference binary and can never match —
  # see issue #95.
  #
  # Fix: build a SECOND, additional artifact here — app-release-fdroid.apk —
  # by applying the exact same patch set F-Droid's own recipe applies, then
  # publish it as an extra GitHub Release asset. metadata.yml's `Binaries:`
  # points at THIS asset, not app-release.apk. The main `build` job above is
  # completely untouched: Play/GitHub/IzzyOnDroid users keep the full-featured
  # binary (push notifications, Sentry crash reporting) unchanged.
  #
  # This job intentionally does NOT run `npx expo prebuild` — F-Droid's own
  # Builds: recipe doesn't either; it patches the already-committed `android/`
  # tree directly. Running prebuild here would regenerate android/app/build.gradle
  # and could diverge from what F-Droid's build server produces from the same
  # tracked source, defeating the byte-for-byte parity this job exists for.
  #
  # This job also intentionally receives NONE of the EXPO_PUBLIC_SENTRY_DSN /
  # EXPO_PUBLIC_POSTHOG_KEY / EXPO_PUBLIC_CHATWOOT_INBOX_IDENTIFIER / SENTRY_*
  # secrets that the main `build` job sets — F-Droid's isolated build
  # environment has no access to this repo's secrets either, so baking any of
  # them into the JS bundle here would itself be a source of reproducible-build
  # divergence.
  build-fdroid:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      # F-Droid's metadata.yml prebuild patch bumps the Kotlin/Java toolchain
      # target from 17 to 21 (see the "Apply F-Droid source patches" step
      # below). Install both so Gradle's toolchain auto-detection can resolve
      # either, matching F-Droid's own multi-JDK build environment.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-fdroid-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-fdroid-

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Apply F-Droid source patches
        # Mirrors distribution/fdroid-submission/metadata.yml `Builds:.prebuild`
        # verbatim so this CI build and F-Droid's from-source rebuild patch the
        # exact same lines/files. Keep these two in sync on any future change.
        run: |
          set -euxo pipefail

          # Drop the Sentry native gradle plugin apply (no SENTRY_* secrets
          # are available in F-Droid's build environment either).
          sed -i '/apply from.*sentry.gradle/d' android/app/build.gradle

          # F-Droid's build environment toolchains on JDK 21; bump the
          # Kotlin/Java compile target used by RN's gradle plugin + expo-modules-core.
          sed -i '/jvmToolchain\|JavaVersion/s/17/21/' \
            node_modules/@react-native/gradle-plugin/*/build.gradle.kts \
            node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt \
            node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
          printf '\nkotlin.jvm.target.validation.mode=warning\n' >> android/gradle.properties

          # Pin react_native_dev_server_ip to localhost (fdroid/react-native-dev-server-ip.patch):
          # the RN gradle plugin bakes the build machine's IP into the APK;
          # the patch adds a reactNativeDevServerIp property (see
          # android/gradle.properties). Mirrors metadata.yml prebuild.
          patch -p1 -d node_modules/@react-native/gradle-plugin < fdroid/react-native-dev-server-ip.patch

          # Strip Firebase Cloud Messaging from expo-notifications.
          sed -i '/firebase/d' node_modules/expo-notifications/android/build.gradle
          cp -a fdroid/expo-notifications-patches/. \
            node_modules/expo-notifications/android/src/main/java/expo/modules/notifications/
          rm -f \
            node_modules/expo-notifications/android/src/main/java/expo/modules/notifications/notifications/RemoteMessageSerializer.java \
            node_modules/expo-notifications/android/src/main/java/expo/modules/notifications/notifications/model/triggers/FirebaseNotificationTrigger.kt

          # Strip Google Play Install Referrer (GMS-only API) from expo-application.
          sed -i '/installreferrer/d' node_modules/expo-application/android/build.gradle
          cp -a fdroid/expo-application-patches/. \
            node_modules/expo-application/android/src/main/java/expo/modules/application/

          # Strip Google Play In-App Review (Play-only APIs) from expo-store-review.
          # Without this, F-Droid's scanner deletes the module's whole build.gradle
          # (usual-suspect hit + `scandelete: node_modules`) and the reference
          # binary keeps the Play Review code/resources, so the reproducible-build
          # comparison can never match — see issue #95.
          sed -i '/play:review/d; /play-services-base/d' node_modules/expo-store-review/android/build.gradle
          cp -a fdroid/expo-store-review-patches/. \
            node_modules/expo-store-review/android/src/main/java/expo/modules/storereview/

      - name: Setup signing
        run: |
          if [[ -n "${{ secrets.KEYSTORE_BASE64 }}" ]]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
            echo "RELEASE_STORE_FILE=release.keystore" >> "$GITHUB_ENV"
            echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            # Same production keystore as app-release.apk: F-Droid's
            # AllowedAPKSigningKeys check requires this binary to carry the
            # same signing certificate fingerprint.
            echo "Signing: production keystore"
          else
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Signing: debug keystore (non-release build)"
          fi

      - name: Build F-Droid-flavored APK
        # Gradle signs v1+v2-only via the committed android/app/build.gradle
        # flags (signingConfigs.release: enableV3Signing/enableV4Signing
        # false — androguard, used by fdroidserver, crashes parsing a v2+v3
        # signature block pair). This job does NOT run `npx expo prebuild`,
        # it patches the committed android/ tree directly, so those flags
        # survive here.
        #
        # Do NOT re-sign with the `apksigner` CLI here: apksigner rewrites
        # Zipflinger's 2-byte zero alignment padding into 0xD935 zipalign
        # extra fields, shifting local-header offsets and breaking F-Droid's
        # reproducible-build v2 digest — the reference APK then never matches
        # F-Droid's from-source rebuild even though all entries are
        # byte-identical. See issue #95 / pipeline 3081125466.
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Rename artifact
        run: cp android/app/build/outputs/apk/release/app-release.apk app-release-fdroid.apk

      - name: Upload F-Droid APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-fdroid
          path: app-release-fdroid.apk

  release:
    needs: [build, build-fdroid]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: app-release

      - uses: actions/download-artifact@v8
        with:
          name: app-release-fdroid

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app-release.apk
            app-release-fdroid.apk
          generate_release_notes: true
