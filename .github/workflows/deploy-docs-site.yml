name: Deploy Docs Site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      # The workflow file itself: without this, merging this PR would not
      # trigger a deploy (the merge changes only this file), and llms.txt /
      # llms-full.txt added by #242 would stay unpublished until the next
      # docs-site/ change. With this, the merge deploy runs the first sync.
      - ".github/workflows/deploy-docs-site.yml"
  workflow_dispatch:

jobs:
  deploy-docs-site:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs-site
          # keep_files is REQUIRED: the gh-pages branch also hosts the live
          # F-Droid repo under fdroid/repo/ and .nojekyll. A sync without it
          # would wipe them.
          keep_files: true
