name: Release uptake series

# Records the install-base uptake curve every day, into the repo.
#
# WHY IT IS A SCHEDULED JOB AND NOT A HUMAN/AGENT TASK
# ----------------------------------------------------
# AGE-111 asks whether the gated share RISES after a release, which needs
# datapoints taken days apart. Three things make "someone runs the script and
# pastes the output" the wrong mechanism:
#
#   * The Sentry token is a GitHub secret. Whoever is asked to measure may not
#     have it, and the honest fallback ("assume gated_share = 0") is the answer
#     that makes every rollout look like a failure.
#   * Sentry release health retains ~90 days. A datapoint not written down when
#     it is taken cannot be recovered. Rollout-day baselines are gone forever.
#   * A skipped week is a hole in the curve, and a hole reads exactly like flat.
#
# So the series is committed to docs/metrics/release-uptake.json — via a pull
# request, not a direct push: main rejects direct pushes (branch protection,
# GH006; see #309). Each run carries the trailing 7 days and merges by date,
# so a missed run backfills and the file self-heals. Read the curve from the
# file or from any run's summary:
#
#   gh workflow run "Release uptake series"
#   gh run watch <id> && gh run view <id>
#   node scripts/uptake-series.mjs --markdown --baseline 2026-08-14

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Trailing window to pull (>=7 backfills gaps; 30 seeds history)"
        required: false
        default: "7"
      baseline:
        description: "Rollout date the trend is measured against"
        required: false
        default: "2026-08-14"
      commit:
        description: "Commit the updated series back to the default branch"
        required: false
        type: boolean
        default: true
  schedule:
    # Daily 15:05 UTC. Daily, not weekly: the unit stored is a calendar day, and
    # a weekly cadence would still be correct but leaves the newest point partial
    # for six days at a time — useless for watching a rollout land.
    - cron: "5 15 * * *"

permissions:
  contents: write
  # Open the datapoint PR + arm auto-merge.
  pull-requests: write
  # Dispatch "Build Android APK" and "iOS CI" onto the PR branch (see below).
  actions: write

concurrency:
  group: release-uptake-series
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # The merge rules (partial days, backfill, never-downgrade) decide what the
      # curve says. They are verified before they are allowed to write history.
      - name: Test the series model
        run: node --test scripts/uptake-series.test.mjs scripts/release-uptake.test.mjs

      - name: Measure
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_PRODUCT_INTELLIGENCE_TOKEN || secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG || 'vibetechnologies' }}
        run: node scripts/release-uptake.mjs --json --days "${{ inputs.days || 7 }}" > /tmp/uptake.json

      - name: Merge into the series
        run: |
          set -euo pipefail
          node scripts/uptake-series.mjs --in /tmp/uptake.json --write --markdown \
            --baseline "${{ inputs.baseline || '2026-08-14' }}" | tee -a "$GITHUB_STEP_SUMMARY"

      # The datapoint reaches main through a pull request: direct pushes to
      # main are rejected by branch protection (GH006, #309).
      #
      # A PR opened with GITHUB_TOKEN does NOT start the required CI checks
      # (token-triggered events never start workflow runs), so this step
      # dispatches "Build Android APK" and "iOS CI" onto the PR branch via
      # workflow_dispatch — the documented exception — and arms auto-merge:
      # GitHub merges once the three required checks pass. Both dispatched
      # workflows carry a `workflow_dispatch` trigger for exactly this.
      #
      # The branch is persistent (metrics/release-uptake) and force-pushed
      # each run, so at most one uptake PR is ever open. If main moves
      # between PR creation and merge, auto-merge waits; the next run
      # rebases the branch and re-dispatches, and the file backfills the
      # trailing 7 days, so no datapoint is lost.
      - name: Open the datapoint pull request
        if: ${{ inputs.commit != false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/metrics/release-uptake.json; then
            echo "no change to the series" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BRANCH=metrics/release-uptake
          DATE=$(date -u +%F)
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/metrics/release-uptake.json
          git commit -m "chore(metrics): record install-base uptake for $DATE"
          # Rebase onto current main so the PR branch stays up to date
          # (branch protection is strict); a concurrent push must not fail
          # the measurement.
          git pull --rebase --autostash origin main || true
          git push --force origin "HEAD:$BRANCH"
          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            echo "reusing open PR #$PR" >> "$GITHUB_STEP_SUMMARY"
          else
            PR_URL=$(gh pr create --base main --head "$BRANCH" \
              --title "chore(metrics): record install-base uptake for $DATE" \
              --body "Daily install-base uptake datapoint (see #309). Related to #309 and #306 — no closing keyword: the datapoint lands when this PR merges.")
            PR=${PR_URL##*/}
            echo "opened $PR_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
          # Token-triggered PRs do not start CI; dispatch the two workflows
          # that own the required checks onto the PR branch.
          gh workflow run build.yml --ref "$BRANCH"
          gh workflow run ios-ci.yml --ref "$BRANCH"
          gh pr merge "$PR" --auto --squash
          echo "PR #$PR will merge once the required checks pass" >> "$GITHUB_STEP_SUMMARY"

      # Option 3 test (#312): can GITHUB_TOKEN approve the PR's own
      # pull_request runs that sit in action_required? Expected to fail
      # by design (the gate exists to require a human). This step records
      # the exact approve-call result in the summary and never fails the
      # run, so a failed approval cannot break the daily series.
      - name: Test bot self-approval of pending runs (#312)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          BRANCH=metrics/release-uptake
          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            echo "no open uptake PR; nothing to approve" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "uptake PR #$PR" >> "$GITHUB_STEP_SUMMARY"
          # Poll for pull_request runs in action_required (they appear a
          # few seconds after the PR opens — the Build run can lag the
          # others by ~15s, so keep polling until a full pass finds
          # nothing new after at least one approval).
          APPROVED=0
          for i in $(seq 1 18); do
            RUNS=$(gh api "repos/${{ github.repository }}/actions/runs?head_branch=$BRANCH&event=pull_request&status=action_required&per_page=10" --jq '.workflow_runs[].id')
            if [ -z "$RUNS" ]; then
              if [ "$APPROVED" -gt 0 ]; then break; fi
            else
              for RUN_ID in $RUNS; do
                CODE=$(curl -s -o "/tmp/approve-$RUN_ID.json" -w '%{http_code}' -X POST \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID/approve")
                echo "approve run $RUN_ID -> HTTP $CODE" | tee -a "$GITHUB_STEP_SUMMARY"
                cat "/tmp/approve-$RUN_ID.json" >> "$GITHUB_STEP_SUMMARY"
                APPROVED=$((APPROVED+1))
              done
            fi
            sleep 10
          done
          if [ "$APPROVED" -eq 0 ]; then
            echo "no pull_request runs in action_required after 3 min" >> "$GITHUB_STEP_SUMMARY"
          fi
