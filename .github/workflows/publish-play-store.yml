name: Publish to Google Play Store

on:
  # Issue #227 (design §2): the `release: published` trigger is RETIRED.
  # Post-change entry paths are tag push and workflow_dispatch only — both
  # funnel through the cua-mid-stream gate job below. build.yml already
  # creates the GitHub release from the tag, and no release path depends
  # on the retired trigger (the sentry-fix loop releases via tag push).
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to release to"
        required: false
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: "Release status (draft = uploads without going live/review; completed = submit; inProgress/halted = staged rollout at user_fraction)"
        required: false
        default: "completed"
        type: choice
        options:
          - completed
          - draft
          - inProgress
          - halted
      user_fraction:
        description: "Staged-rollout user fraction (0.0-1.0, exclusive). Used only when status is inProgress or halted; empty otherwise."
        required: false
        default: "0.20"
        type: string
      cua_force_fail:
        description: "Proof runs only: force the mid-stream-exit CUA gate to fail (CUA_FORCE_FAIL=1) and verify publication is blocked. Dispatch-only — a tag push cannot set it."
        required: false
        default: false
        type: boolean

# Issue #230 (design §3, N3): the tag-path Record step PATCHes the GitHub
# release body with the rollout fraction/versionCode/status. That is the
# only write this workflow's GITHUB_TOKEN performs.
permissions:
  contents: write

# Concurrent runs for the same ref must not race two uploads into the same
# track. Serialize per ref instead of cancelling, because cancelling
# mid-upload can leave a half-created Play release.
concurrency:
  group: publish-play-store-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Issue #227 (design §2, Option A): the mid-stream-exit CUA is job 1 of
  # this workflow and the publish job `needs:` it — same run, same
  # github.sha by construction. A failed gate skips publication; a green
  # showcase run in cua-smoke.yml does NOT satisfy this gate.
  # DISABLED as a publish gate (Den, 2026-11-06): no model tokens/credits
  # for the real CUA run. Manual-dispatch only and non-blocking - publish
  # does not `needs:` it. Re-enable (one line each): remove the `if:` below
  # and restore `needs: [cua-mid-stream]` on the publish job.
  cua-mid-stream:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      # CUA driver uses chat-completions; 2024-08-01-preview is sufficient.
      AZURE_OPENAI_API_VERSION: "2024-08-01-preview"
      # opencode's @ai-sdk/azure provider hits the new /openai/v1/responses
      # endpoint. That endpoint accepts ONLY api-version=preview or v1 — every
      # date-based value returns 400 and forces MODEL_CAPABLE=false, which is
      # FATAL for the mid-stream-exit scenario (design §1).
      OPENCODE_AZURE_API_VERSION: "preview"
      # Emulator reaches the runner host via 10.0.2.2.
      OPENCODE_URL: "http://10.0.2.2:4096"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Add emulator to PATH
        run: echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Purge stale generated sources
        # Same stale-autolinking guard as the publish job and cua-smoke.yml:
        # a restored generated tree from a previous package id breaks the
        # build for cc.agentlabs.opencode.
        run: rm -rf android/app/build/generated android/build/generated android/app/build/intermediates

      - name: Install dependencies & build APK
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: |
          npm install --legacy-peer-deps
          npx expo prebuild --platform android --no-install
          keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cd android && ./gradlew assembleRelease

      - name: Install Python deps
        run: pip install openai

      - name: Configure opencode Azure provider
        env:
          AZURE_OPENAI_MODEL: "gpt-5.4"
        run: |
          npm install -g opencode-ai
          # opencode (released npm pkg) does NOT read AZURE_OPENAI_* for its own LLM.
          # It needs an explicit provider in opencode.json + a default `model`.
          # Wire the same Azure resource the CUA driver uses (@ai-sdk/azure).
          # Extract the resource name from the endpoint secret at runtime
          # (e.g. https://NAME.openai.azure.com -> NAME) so nothing secret is in source.
          RESOURCE_NAME="$(printf '%s' "$AZURE_OPENAI_ENDPOINT" | sed -E 's#https?://([^.]+)\..*#\1#')"
          echo "Derived Azure resource name: ${RESOURCE_NAME:-<empty>}"
          mkdir -p "$HOME/.config/opencode"
          cat > "$HOME/.config/opencode/opencode.json" <<EOF
          {
            "\$schema": "https://opencode.ai/config.json",
            "provider": {
              "azure": {
                "npm": "@ai-sdk/azure",
                "name": "Azure OpenAI",
                "options": {
                  "resourceName": "${RESOURCE_NAME}",
                  "apiKey": "{env:AZURE_OPENAI_API_KEY}",
                  "apiVersion": "${OPENCODE_AZURE_API_VERSION}"
                },
                "models": {
                  "${AZURE_OPENAI_MODEL}": { "name": "Azure ${AZURE_OPENAI_MODEL}" }
                }
              }
            },
            "model": "azure/${AZURE_OPENAI_MODEL}",
            "small_model": "azure/${AZURE_OPENAI_MODEL}"
          }
          EOF
          echo "opencode.json written:"; cat "$HOME/.config/opencode/opencode.json"

      - name: Start opencode server on runner host
        run: |
          set -x
          # Bind all interfaces so the emulator can reach it via 10.0.2.2.
          nohup opencode serve --hostname 0.0.0.0 --port 4096 --print-logs > /tmp/opencode-server.log 2>&1 &
          SRV_PID=$!
          echo "opencode pid=$SRV_PID"
          echo "Waiting for opencode server /global/health ..."
          HEALTHY=0
          for i in $(seq 1 60); do
            if curl -sf --connect-timeout 2 -m 5 http://127.0.0.1:4096/global/health > /dev/null; then
              echo "opencode server healthy after ${i}s"
              HEALTHY=1
              break
            fi
            if [ $((i % 10)) -eq 0 ]; then
              echo "--- @${i}s: server log so far ---"
              tail -20 /tmp/opencode-server.log || true
              echo "--- listening ports ---"
              ss -tlnp 2>/dev/null | grep -E ':4096|opencode' || echo "no listener on 4096"
              echo "--- pid alive? ---"
              kill -0 $SRV_PID 2>/dev/null && echo "pid $SRV_PID alive" || echo "pid $SRV_PID DEAD"
            fi
            sleep 1
          done
          if [ "$HEALTHY" != "1" ]; then
            echo "::error::opencode server failed to become healthy in 60s"
            echo "--- final server log ---"
            cat /tmp/opencode-server.log || true
            exit 1
          fi

      - name: Probe opencode model capability (can it reply?)
        id: probe
        env:
          AZURE_OPENAI_MODEL: "gpt-5.4"
        run: |
          # Deterministic check that the server can actually produce a
          # streaming assistant reply BEFORE the emulator run. Unlike
          # cua-smoke.yml (informational there), MODEL_CAPABLE is FATAL for
          # the mid-stream-exit gate (design §1): it is passed to the
          # scenario step, and the harness fails the gate when it is false.
          set +e
          SID=$(curl -s -X POST http://127.0.0.1:4096/session -H 'content-type: application/json' -d '{}' | python3 -c "import sys,json;print(json.load(sys.stdin).get('id',''))" 2>/dev/null)
          echo "session id: ${SID:-<none>}"
          CAPABLE=false
          if [ -n "$SID" ]; then
            HTTP=$(curl -s -o /tmp/probe_reply.json -w '%{http_code}' \
              -X POST "http://127.0.0.1:4096/session/$SID/message" \
              -H 'content-type: application/json' \
              -d "{\"model\":{\"providerID\":\"azure\",\"modelID\":\"$AZURE_OPENAI_MODEL\"},\"parts\":[{\"type\":\"text\",\"text\":\"reply with the single word: pong\"}]}" \
              2>/tmp/probe_err.txt)
            echo "probe HTTP status: ${HTTP:-<none>}"
            echo "--- probe reply (truncated) ---"; head -c 3000 /tmp/probe_reply.json; echo
            echo "--- probe err (truncated) ---"; head -c 1000 /tmp/probe_err.txt; echo
            if [ "$HTTP" = "200" ] && grep -qi 'assistant' /tmp/probe_reply.json && grep -qi 'pong\|"text"' /tmp/probe_reply.json; then
              CAPABLE=true
            fi
          fi
          echo "MODEL_CAPABLE=$CAPABLE" >> "$GITHUB_OUTPUT"
          echo "opencode model-capable in CI: $CAPABLE"

      - name: Write CUA runner script
        run: |
          cat > /tmp/cua-runner.sh << 'RUNNEREOF'
          #!/bin/sh
          # Generated by CI workflow — runs ONLY the mid-stream-exit gate
          # scenario (issue #227, design §1). A showcase run does not
          # satisfy this gate.
          set -e
          exec python3 scripts/android-cua-smoke.py --mid-stream-exit --model gpt-5.4 --include-xml --opencode-url "${OPENCODE_URL}" --artifacts-dir /tmp/cua-artifacts --apk-path android/app/build/outputs/apk/release/app-release.apk
          RUNNEREOF
          chmod +x /tmp/cua-runner.sh

      - name: Run mid-stream-exit CUA gate with emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          OPENCODE_URL: ${{ env.OPENCODE_URL }}
          # Fatal for this scenario (design §1): the harness fails the gate
          # when the probe found the model incapable of replying/streaming.
          MODEL_CAPABLE: ${{ steps.probe.outputs.MODEL_CAPABLE }}
          # Failure-blocks-publication proof hook (design §2): the
          # dispatch-only cua_force_fail input wires CUA_FORCE_FAIL=1 to
          # this step. The input does not exist on tag pushes, so a tag
          # run can never set it.
          CUA_FORCE_FAIL: ${{ inputs.cua_force_fail == true && '1' || '' }}
        with:
          api-level: 28
          arch: x86_64
          target: default
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          # NOTE: android-emulator-runner wraps script content in sh -c "..."
          # which breaks on inner " chars. Use a temp shell script instead.
          script: |
            adb shell pm clear cc.agentlabs.opencode || true
            adb install android/app/build/outputs/apk/release/app-release.apk
            adb shell am start -n cc.agentlabs.opencode/.MainActivity
            sleep 5
            sh /tmp/cua-runner.sh

      - name: opencode server log
        if: always()
        run: cat /tmp/opencode-server.log || true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cua-mid-stream-artifacts-${{ github.run_number }}
          # Extended for the mid-stream-exit gate (design §1 artifacts):
          # manifest.json (github.sha, tag, APK sha256, package,
          # versionName/versionCode from aapt dump badging, per-cycle
          # samples/timestamps/INVALID flag/PID), the logcat dump, and
          # 1 screenshot per cycle — all written by the harness into
          # /tmp/cua-artifacts.
          path: |
            /tmp/cua-artifacts/manifest.json
            /tmp/cua-artifacts/logcat.txt
            /tmp/cua-artifacts/logcat-cycle-*.txt
            /tmp/cua-artifacts/cycle-*.png
            /tmp/cua_*.png
            /tmp/cua_*.mp4
          if-no-files-found: warn

  publish:
    # CUA gate DISABLED (Den, 2026-11-06): no `needs:` on cua-mid-stream -
    # publication is not blocked by it. See the cua-mid-stream job comment.
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
      EXPO_PUBLIC_POSTHOG_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_KEY }}
      EXPO_PUBLIC_CHATWOOT_INBOX_IDENTIFIER: ${{ secrets.EXPO_PUBLIC_CHATWOOT_INBOX_IDENTIFIER }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Android build outputs
        uses: actions/cache@v5
        with:
          path: |
            android/app/build/intermediates
            android/build
            android/app/.cxx
          key: ${{ runner.os }}-android-build-${{ hashFiles('package-lock.json', 'android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-android-build-

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Bump android.versionCode in app.json
        # Play Store rejects duplicate versionCodes, so derive a monotonic value
        # from github.run_number + offset. expo prebuild reads this into build.gradle.
        # Offset 100 skips past historical collisions (run 31 collided with a
        # manual upload at versionCode 31). Next run = run_number + 100.
        run: |
          node -e "const f='app.json';const j=require('./'+f);j.expo.android=j.expo.android||{};j.expo.android.versionCode=${{ github.run_number }}+100;require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          echo "versionCode now: $(node -p "require('./app.json').expo.android.versionCode")"

      - name: Set Sentry release identifiers
        # sentry.gradle (applied from android/app/build.gradle) defaults the
        # upload's --release/--dist to `${applicationId}@${versionName}+${versionCode}`,
        # which does NOT match the release/dist Sentry.init() reports at runtime
        # (`opencode-mobile@${app.json version}`, see src/lib/sentry.ts). That
        # mismatch made every uploaded source map land under a release Sentry
        # never looks up, so symbolication silently failed. Pin the Gradle-side
        # values to exactly what the app reports. (Only expo.version matters
        # here, not the android.versionCode bumped above.)
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "SENTRY_RELEASE=opencode-mobile@${VERSION}" >> "$GITHUB_ENV"
          echo "SENTRY_DIST=${VERSION}" >> "$GITHUB_ENV"
          echo "Sentry release=opencode-mobile@${VERSION} dist=${VERSION}"

      - name: Purge stale generated sources
        # The Android build cache (restore-keys prefix fallback) can restore a
        # generated autolinking tree from a previous package id. Gradle then
        # reuses ReactNativeApplicationEntryPoint.java referencing the OLD
        # package (ai.opencode.mobile.BuildConfig) and compileReleaseJavaWithJavac
        # fails. Delete generated sources so prebuild + Gradle regenerate them
        # for the current package (cc.agentlabs.opencode).
        run: rm -rf android/app/build/generated android/build/generated android/app/build/intermediates

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build AAB
        working-directory: android
        env:
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Verify the Sentry noise gate is in the artifact
        # AGE-105: the org error quota is defended ONLY by the client-side gate.
        # Every server-side lever on this Sentry plan was probed and is dead
        # (docs/analytics.md): per-key rate limit answers 200 and silently drops
        # the field, custom error-message filters answer 400 "You do not have
        # that feature enabled", and spike protection is already on everywhere
        # but only catches spikes, not this steady baseline. If a build ships
        # without the gate — or without a DSN, which makes Sentry a silent
        # no-op — the org goes back over quota, and while it is over quota
        # Sentry stores nothing, so the regression is invisible in Sentry itself
        # until the monthly reset.
        # Grep the shipped Hermes bundle instead. Verified to discriminate:
        # v0.4.14 passes, pre-gate v0.4.13 fails.
        # Issue #232: the second argument cross-checks the shipped bundle's
        # `sentry-dbid-<uuid>` marker against the Debug ID of the built
        # release source map (path per @react-native/gradle-plugin:
        # generated/sourcemaps/react/<variant>/index.android.bundle.map).
        run: node scripts/verify-release-bundle.mjs android/app/build/outputs/bundle/release/app-release.aab android/app/build/generated/sourcemaps/react/release/index.android.bundle.map

      - name: Upload native debug symbols to Sentry
        # Issue #232: nothing ever uploaded the native (.so) debug symbols -
        # sentry.gradle creates only the JS bundle/source-map upload task, so
        # Sentry held no debug files for the ELF build IDs in the AAB and
        # true native frames could not be symbolicated. Upload the UNSTRIPPED
        # libs from the release build's merged_native_libs intermediates
        # (association is by ELF build ID, so this is dist-independent and
        # unaffected by the versionName/versionCode dist split). The stripped
        # and symbol-table intermediates are only fallbacks if a future AGP
        # moves the merged output. Plain step on purpose: missing libs,
        # missing CLI or an upload error all fail the job.
        run: |
          set -euo pipefail
          SENTRY_CLI=node_modules/@sentry/cli/bin/sentry-cli
          if [ ! -x "$SENTRY_CLI" ]; then
            echo "::error::bundled sentry-cli not found at $SENTRY_CLI"
            exit 1
          fi
          "$SENTRY_CLI" --version
          LIBS=""
          for candidate in \
            android/app/build/intermediates/merged_native_libs/release \
            android/app/build/intermediates/stripped_native_libs/release \
            android/app/build/intermediates/native_symbol_tables/release; do
            if [ -d "$candidate" ] && [ -n "$(find "$candidate" \( -name '*.so' -o -name '*.sym' \) -print -quit)" ]; then
              LIBS="$candidate"
              break
            fi
          done
          if [ -z "$LIBS" ]; then
            echo "::error::no native libs found in any release intermediates directory - nothing to upload"
            exit 1
          fi
          echo "Uploading native debug symbols from $LIBS ($(find "$LIBS" -name '*.so' | wc -l) .so files)"
          "$SENTRY_CLI" debug-files upload \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT" \
            "$LIBS"

      - name: Verify Sentry artifacts for release
        # Issue #232: prove server-side that this release's artifacts exist,
        # so a skipped or silently failed upload can no longer ship green.
        # (i) JS bundle + source map, via the artifact-bundle API. WHY NOT
        # `sentry-cli releases files list` (PR #233): the Gradle upload runs
        # `sentry-cli react-native gradle`, which only uploads an artifact
        # bundle with a weak release/dist association — sentry-cli 2.53.0
        # source (src/commands/react_native/gradle.rs) contains NO release
        # creation, and Sentry docs state creating a release is "no longer
        # required" with Debug IDs. No Release object exists, so the legacy
        # release-files endpoint 404s ("Release not found", publish run
        # 43565249322). Creating the release first was NOT used: the
        # artifact index that endpoint reads is keyed by the Release object
        # and written at upload time, so nothing proves the bundle's files
        # become listable after a late `releases new`. Instead query the
        # artifact-bundle endpoints directly (the same endpoints Sentry's
        # own web UI uses for Project Settings > Source Maps > Artifact
        # Bundles; getsentry/sentry src/sentry/api/endpoints/
        # artifact_bundles.py + project_artifact_bundle_files.py): list
        # bundles by release, then list the matched bundle's files and
        # require ~/index.android.bundle + ~/index.android.bundle.map with
        # one shared non-empty debug id — that shared id is what makes
        # symbolication work. (ii) Native debug files: sentry-cli 2.53.0 has
        # NO server-side debug-files list (its debug-files subcommands are
        # bundle-sources/check/find/print-sources/upload, and `find` is
        # local-only), so query the Sentry API's project debug-files (dsyms)
        # endpoint with the same SENTRY_AUTH_TOKEN; a non-200 response or an
        # empty list fails the job. No continue-on-error on purpose.
        run: |
          set -euo pipefail
          echo "Verifying Sentry artifacts for release $SENTRY_RELEASE (dist $SENTRY_DIST)"
          # (i-a) Find the artifact bundle associated with this release+dist.
          HTTP_CODE="$(curl -sS -o /tmp/sentry-bundles.json -w '%{http_code}' \
            -G --data-urlencode "query=$SENTRY_RELEASE" --data-urlencode "per_page=100" \
            -H "Authorization: Bearer ${SENTRY_AUTH_TOKEN}" \
            "https://sentry.io/api/0/projects/${SENTRY_ORG}/${SENTRY_PROJECT}/files/artifact-bundles/")"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Sentry artifact-bundles API returned HTTP $HTTP_CODE"
            exit 1
          fi
          cat > /tmp/sentry-find-bundle.py <<'PY'
          import json, os, sys
          data = json.load(open('/tmp/sentry-bundles.json'))
          if not isinstance(data, list):
              print('::error::unexpected artifact-bundles response (not a JSON list)', file=sys.stderr)
              sys.exit(2)
          want_release, want_dist = os.environ['SENTRY_RELEASE'], os.environ['SENTRY_DIST']
          for bundle in data:  # API sorts newest first
              for assoc in bundle.get('associations', []):
                  if assoc.get('release') == want_release and assoc.get('dist') == want_dist:
                      print(f"Matched artifact bundle {bundle['bundleId']} "
                            f"(fileCount={bundle.get('fileCount')}, date={bundle.get('date')})",
                            file=sys.stderr)
                      print(bundle['bundleId'])
                      sys.exit(0)
          print(f'::error::no artifact bundle associated with release {want_release} dist {want_dist}',
                file=sys.stderr)
          sys.exit(1)
          PY
          BUNDLE_ID="$(python3 /tmp/sentry-find-bundle.py)"
          echo "Artifact bundle ID: $BUNDLE_ID"
          # (i-b) List the matched bundle's files; require the bundle and its
          # source map, linked by one shared non-empty debug id.
          HTTP_CODE="$(curl -sS -o /tmp/sentry-bundle-files.json -w '%{http_code}' \
            -G --data-urlencode "per_page=100" \
            -H "Authorization: Bearer ${SENTRY_AUTH_TOKEN}" \
            "https://sentry.io/api/0/projects/${SENTRY_ORG}/${SENTRY_PROJECT}/artifact-bundles/${BUNDLE_ID}/files/")"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Sentry artifact-bundle files API returned HTTP $HTTP_CODE"
            exit 1
          fi
          cat > /tmp/sentry-check-bundle-files.py <<'PY'
          import json, sys
          data = json.load(open('/tmp/sentry-bundle-files.json'))
          files = data.get('files')
          if not isinstance(files, list):
              print('::error::unexpected artifact-bundle files response (no files list)', file=sys.stderr)
              sys.exit(2)
          by_path = {f.get('filePath'): f for f in files}
          for path in ('~/index.android.bundle', '~/index.android.bundle.map'):
              entry = by_path.get(path)
              if entry is None:
                  print(f'::error::{path} not present in artifact bundle', file=sys.stderr)
                  sys.exit(1)
              print(f"Found {path} (size={entry.get('fileSize')}, "
                    f"debugId={entry.get('debugId')}, sourcemap={entry.get('sourcemap')})")
          bundle_id = by_path['~/index.android.bundle'].get('debugId')
          map_id = by_path['~/index.android.bundle.map'].get('debugId')
          if not bundle_id or not map_id:
              print('::error::bundle or source map is missing its debug id', file=sys.stderr)
              sys.exit(1)
          if bundle_id != map_id:
              print(f'::error::debug id mismatch: bundle {bundle_id} vs map {map_id}', file=sys.stderr)
              sys.exit(1)
          print(f'JS bundle + source map verified, shared debug id {bundle_id}')
          PY
          python3 /tmp/sentry-check-bundle-files.py
          HTTP_CODE="$(curl -sS -o /tmp/sentry-dsyms.json -w '%{http_code}' \
            -H "Authorization: Bearer ${SENTRY_AUTH_TOKEN}" \
            "https://sentry.io/api/0/projects/${SENTRY_ORG}/${SENTRY_PROJECT}/files/dsyms/")"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Sentry debug-files API returned HTTP $HTTP_CODE"
            exit 1
          fi
          python3 -c "import json,sys; d=json.load(open('/tmp/sentry-dsyms.json')); sys.exit(0 if isinstance(d,list) and len(d)>0 else 1)" || {
            echo "::error::no native debug files stored for project $SENTRY_PROJECT"
            exit 1
          }
          echo "Sentry artifacts verified for $SENTRY_RELEASE: bundle + source map in artifact bundle $BUNDLE_ID (shared debug id), native debug files present."

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Resolve Play track
        id: channel
        # AGE-110: releases used to land on `internal` and stop there — production
        # only moved when a human remembered to run workflow_dispatch. It served
        # versionCode 136 (v0.4.5, 2026-06-22) for EIGHT weeks for that reason,
        # which is why a client-side fix shipped in v0.4.14 could not reach the
        # install base. A release tag is already a deliberate act; treat it as one
        # and publish it to the auto-updating channel. Manual dispatch keeps its
        # inputs so `internal`/`draft` dry runs are still one click away.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TRACK="${{ github.event.inputs.track || 'internal' }}"
            STATUS="${{ github.event.inputs.status || 'completed' }}"
            USER_FRACTION_INPUT="${{ github.event.inputs.user_fraction || '0.20' }}"
          else
            # Issue #230 (design §1): a tag publish is a STAGED rollout —
            # production at 20% (status inProgress), held over the 3-day
            # Sentry watch, then completed/halted via play-rollout.yml.
            TRACK=production
            STATUS=inProgress
            USER_FRACTION_INPUT="0.20"
          fi
          # Effective fraction (design §1): the pinned upload action REQUIRES
          # a userFraction for inProgress/halted and REJECTS one for
          # completed/draft, so the output is set only for the staged
          # statuses and empty otherwise (empty = unset for the action),
          # regardless of the user_fraction input's default.
          USER_FRACTION=""
          if [ "$STATUS" = "inProgress" ] || [ "$STATUS" = "halted" ]; then
            USER_FRACTION="$USER_FRACTION_INPUT"
          fi
          echo "track=$TRACK" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "user_fraction=$USER_FRACTION" >> "$GITHUB_OUTPUT"
          echo "event=${{ github.event_name }} -> track=$TRACK status=$STATUS user_fraction=${USER_FRACTION:-none}"

      - name: Publish to Play Store
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: cc.agentlabs.opencode
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ steps.channel.outputs.track }}
          status: ${{ steps.channel.outputs.status }}
          userFraction: ${{ steps.channel.outputs.user_fraction }}
          whatsNewDirectory: distribution/whatsnew

      - name: Record where it landed
        if: always()
        run: |
          {
            echo "### Play publish"
            echo ""
            echo "- event: \`${{ github.event_name }}\`"
            echo "- track: \`${{ steps.channel.outputs.track }}\`"
            echo "- status: \`${{ steps.channel.outputs.status }}\`"
            echo "- userFraction: \`${{ steps.channel.outputs.user_fraction || 'none' }}\`"
            echo "- versionCode: \`$(node -p "require('./app.json').expo.android.versionCode" 2>/dev/null || echo unknown)\`"
            echo "- version: \`$(node -p "require('./app.json').expo.version" 2>/dev/null || echo unknown)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record staged rollout on the GitHub release (tag path)
        # Issue #230 (design §3): on a tag publish, record the rollout on the
        # GitHub release itself — fraction + versionCode + status inProgress —
        # so the Sentry loop dispatches halt/complete against the recorded
        # versionCode. build.yml creates that release in a parallel workflow,
        # so poll the releases API for up to ~10 min; if it never appears this
        # step FAILS LOUDLY (the upload already happened — a red run is the
        # alarm). Runs only on the tag (push) path and only after a green
        # upload (no `if: always()`).
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VERSION_CODE="$(node -p "require('./app.json').expo.android.versionCode")"
          FRACTION="${{ steps.channel.outputs.user_fraction }}"
          STATUS_VALUE="${{ steps.channel.outputs.status }}"
          RELEASE_ID=""
          for i in $(seq 1 60); do
            RELEASE_ID="$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" --jq '.id // empty' 2>/dev/null || true)"
            if [ -n "$RELEASE_ID" ]; then
              break
            fi
            echo "GitHub release for tag ${TAG} not found yet (attempt ${i}/60); waiting 10s"
            sleep 10
          done
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::GitHub release for tag ${TAG} never appeared after ~10 min — the Play upload happened but the rollout is NOT recorded on the release."
            exit 1
          fi
          gh api "repos/${{ github.repository }}/releases/${RELEASE_ID}" --jq '.body // ""' > /tmp/release-body.txt
          export ROLLOUT_LINE="Rollout: fraction ${FRACTION} — versionCode ${VERSION_CODE} — status ${STATUS_VALUE}"
          python3 - <<'PYEOF'
          import json, os
          old = open("/tmp/release-body.txt").read()
          line = os.environ["ROLLOUT_LINE"]
          new = (old.rstrip("\n") + "\n" + line + "\n") if old.strip() else (line + "\n")
          json.dump({"body": new}, open("/tmp/release-patch.json", "w"))
          PYEOF
          gh api --method PATCH "repos/${{ github.repository }}/releases/${RELEASE_ID}" --input /tmp/release-patch.json > /dev/null
          echo "Recorded on GitHub release ${RELEASE_ID} (${TAG}): ${ROLLOUT_LINE}"
